<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BWEB Inspector</title>
    <style>
        body { font-family: sans-serif; font-size: 12px; margin: 0; display: flex; height: 100vh; background: #242424; color: #fff; }
        #sidebar { width: 50%; border-right: 1px solid #444; overflow-y: auto; padding: 10px; }
        #details { width: 50%; overflow-y: auto; padding: 10px; }
        .node { cursor: pointer; padding: 2px; }
        .node:hover { background: #333; }
        .tag { color: #5db0d7; }
        .attr { color: #d7ba7d; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>BML / BDT Tree</h3>
        <div id="tree">Loading BWEB Tree...</div>
    </div>
    <div id="details">
        <h3>BLB Layout Box (Computed)</h3>
        <pre id="blb-info">Select a node</pre>
        <h3>BDT VM State</h3>
        <pre id="bdt-info">Idle</pre>
        <h3>Performance Metrics</h3>
        <pre id="perf-info">Waiting for frames...</pre>
    </div>
    <script src="devtools_panel.js"></script>
</body>
</html>
