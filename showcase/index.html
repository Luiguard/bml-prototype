<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BWEB Showcase (Polyfill)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #050505; color: #f0f0f5; font-family: 'Outfit', sans-serif; }
        #bweb-canvas { display: block; width: 100vw; height: 100vh; }
        #a11y-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
        #loading { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #0a0a0f; z-index: 1000;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(94, 106, 210, 0.3); border-radius: 50%;
            border-top-color: #5e6ad2; animation: spin 1s ease-in-out infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading BWEB Engine Polyfill...</div>
    </div>
    
    <canvas id="bweb-canvas" style="display: none;"></canvas>
    <div id="a11y-container"></div>
    
    <script type="module">
        import { BwebCore } from '../bweb-engine/core.js?v=2';
        
        async function boot() {
            const canvas = document.getElementById('bweb-canvas');
            const container = document.getElementById('a11y-container');
            const loading = document.getElementById('loading');
            
            try {
                // Initialisiere die Engine & WASM VM
                const engine = new BwebCore(canvas, container);
                await engine.init();
                
                // Lade das kompilierte BWEB Payload
                console.log("Fetching showcase.bweb...");
                const response = await fetch('showcase.bweb?v=' + Date.now());
                const buffer = await response.arrayBuffer();
                const view = new DataView(buffer);
                if (view.getUint32(0) !== 0x42574542) throw new Error("Invalid BWEB signature");
                const numSections = view.getUint32(4);
                
                let headerOffset = 8;
                let dataOffset = 8 + 8 * numSections;
                
                const sections = {};
                for (let i = 0; i < numSections; i++) {
                    const id = view.getUint8(headerOffset);
                    const len = view.getUint32(headerOffset + 1);
                    const compressed = view.getUint8(headerOffset + 5);
                    headerOffset += 8;
                    
                    const slice = buffer.slice(dataOffset, dataOffset + len);
                    dataOffset += len;
                    
                    if (compressed) {
                        try {
                            const ds = new DecompressionStream('deflate');
                            const writer = ds.writable.getWriter();
                            writer.write(new Uint8Array(slice));
                            writer.close();
                            const decompResponse = new Response(ds.readable);
                            sections[id] = await decompResponse.arrayBuffer();
                        } catch(e) {
                            console.error("Decompression failed for section", id, e);
                        }
                    } else {
                        sections[id] = slice;
                    }
                }
                
                // Parse BLB (Section 3)
                const blbBlocks = [];
                if (sections[3]) {
                    const blbView = new DataView(sections[3]);
                    const count = blbView.getUint32(0);
                    let off = 4;
                    for (let i = 0; i < count; i++) {
                        const id = blbView.getUint16(off);
                        const propCount = blbView.getUint8(off + 2);
                        off += 3;

                        let left = 0, top = 0, width = 0, height = 0;
                        let bg = 0, color = 0, borderColor = 0;
                        let borderRadius = 0, glass = false, textAlign = 0, display = 1;
                        let fontFamily = '', filterBlurPx = 0, fontWeight = 400, fontSize = 16;

                        for (let p = 0; p < propCount; p++) {
                            const tag = blbView.getUint8(off);
                            const type = blbView.getUint8(off + 1);
                            
                            if (type === 0) { // dim (7 bytes)
                                const val = blbView.getInt32(off + 3) / 100;
                                if (tag === 1) width = val;
                                else if (tag === 2) height = val;
                                else if (tag === 46) left = val;
                                else if (tag === 47) top = val;
                                else if (tag === 35) borderRadius = val;
                                else if (tag === 19) fontSize = val;
                                off += 7;
                            } else if (type === 1) { // enum/u8 (3 bytes)
                                const v8 = blbView.getUint8(off + 2);
                                if (tag === 38) glass = true;
                                else if (tag === 20) textAlign = v8;
                                else if (tag === 5) display = v8;
                                off += 3;
                            } else if (type === 2) { // color (6 bytes)
                                const c32 = blbView.getUint32(off + 2);
                                if (tag === 17) bg = c32;
                                else if (tag === 18) color = c32;
                                else if (tag === 36) borderColor = c32;
                                off += 6;
                            } else if (type === 3) { // string
                                const len = blbView.getUint16(off + 2);
                                const str = new TextDecoder('utf-8').decode(new Uint8Array(sections[3], off + 4, len));
                                if (tag === 21) fontFamily = str;
                                off += 4 + len;
                            } else if (type === 4) { // uint16
                                const val = blbView.getUint16(off + 2);
                                if (tag === 39) filterBlurPx = val;
                                else if (tag === 22) fontWeight = val;
                                off += 4;
                            }
                        }

                        blbBlocks.push({
                            nodeId: id,
                            left, top, width, height, color, backgroundColor: bg,
                            borderColor, borderRadius, glass, textAlign, display,
                            fontFamily, filterBlurPx, fontWeight, fontSize
                        });
                    }
                }
                
                // Parse BML (Section 1)
                const bmlTexts = [];
                if (sections[1]) {
                    const bmlView = new DataView(sections[1]);
                    const decoder = new TextDecoder('utf-8');
                    let off = 4; // Skip BML header
                    while (off < sections[1].byteLength) {
                        const tagByte = bmlView.getUint8(off);
                        if (tagByte === 0xFF) {
                            const len = bmlView.getUint16(off + 1);
                            const text = decoder.decode(new Uint8Array(sections[1], off + 3, len));
                            bmlTexts.push(text);
                            off += 3 + len;
                        } else {
                            const attrCount = bmlView.getUint8(off + 1);
                            off += 2;
                            let srcAttr = "";
                            for (let a = 0; a < attrCount; a++) {
                                const attrId = bmlView.getUint8(off);
                                const len = bmlView.getUint16(off + 1);
                                
                                if (attrId === 18) { // 0x12 (src) in bml-compiler.js
                                    srcAttr = decoder.decode(new Uint8Array(sections[1], off + 3, len));
                                }
                                off += 3 + len;
                            }
                            bmlTexts.push(srcAttr); // Speichere src temporär im Text-Array für BDT-Mapping
                        }
                    }
                }
                
                // Parse BDT (Section 2)
                const bdtNodes = [];
                if (sections[2]) {
                    const bdtView = new DataView(sections[2]);
                    const count = blbBlocks.length;
                    for (let i = 0; i < count; i++) {
                        const off = i * 15;
                        if (off + 15 > sections[2].byteLength) break;
                        const nodeId = bdtView.getUint32(off);
                        const parentId = bdtView.getUint16(off + 4);
                        const nextSibling = bdtView.getUint16(off + 6);
                        const tag = bdtView.getUint8(off + 13);
                        const depth = bdtView.getUint8(off + 14);
                        
                        bdtNodes.push({
                            nodeId,
                            parentId,
                            nextSibling,
                            firstChild: 0xFFFF,
                            tag,
                            depth,
                            text: (bmlTexts[i] && !bmlTexts[i].startsWith('bib://') && !bmlTexts[i].startsWith('bvs://')) ? bmlTexts[i] : "",
                            src: (bmlTexts[i] && (bmlTexts[i].startsWith('bib://') || bmlTexts[i].startsWith('bvs://'))) ? bmlTexts[i] : ""
                        });
                    }
                    
                    // Rekonstruiere firstChild aus parentId
                    const nodeMap = {};
                    for (const n of bdtNodes) nodeMap[n.nodeId] = n;
                    for (const n of bdtNodes) {
                        if (n.parentId !== 0xFFFF && nodeMap[n.parentId]) {
                            const parent = nodeMap[n.parentId];
                            if (parent.firstChild === 0xFFFF) {
                                parent.firstChild = n.nodeId;
                            }
                        }
                    }
                    
                    // Log asset refs for debugging
                    const assetRefs = bdtNodes.filter(n => n.src);
                    if (assetRefs.length > 0) {
                        console.log("[BDT] Asset references:", assetRefs.map(n => ({nodeId: n.nodeId, src: n.src})));
                    }
                }
                
                console.log("Parsed BWEB:", {
                    bdtNodes: bdtNodes.slice(0, 5),
                    blbBlocks: blbBlocks.slice(0, 5),
                    totalNodes: bdtNodes.length
                });

                // Parse BIB (Section 4) — Format: [ID:u16 | Format:u8 | Compress:u8 | Len:u32 | Data:Len]
                const engineAssets = {};
                if (sections[4]) {
                    const bibArr = new Uint8Array(sections[4]);
                    const bibView = new DataView(sections[4]);
                    let off = 0;
                    while (off + 8 <= sections[4].byteLength) {
                        const id = bibView.getUint16(off);
                        const fmt = bibView.getUint8(off + 2);
                        const comp = bibView.getUint8(off + 3);
                        const len = bibView.getUint32(off + 4);
                        if (off + 8 + len > sections[4].byteLength) break;
                        
                        const data = bibArr.slice(off + 8, off + 8 + len);
                        
                        // MIME detection via magic bytes
                        let mime = 'image/png';
                        if (data[0] === 0xFF && data[1] === 0xD8) mime = 'image/jpeg';
                        else if (data[0] === 0x89 && data[1] === 0x50) mime = 'image/png';
                        else if (data[0] === 0x52 && data[1] === 0x49) mime = 'image/webp'; // RIFF
                        else if (data[0] === 0x3C) mime = 'image/svg+xml'; // <
                        
                        const blob = new Blob([data], { type: mime });
                        
                        if (mime === 'image/svg+xml') {
                            const url = URL.createObjectURL(blob);
                            const img = new Image();
                            img.src = url;
                            await new Promise(r => { img.onload = r; img.onerror = r; });
                            engineAssets[`bib://${id}`] = { type: 'image', bitmap: img };
                        } else {
                            const bitmap = await createImageBitmap(blob);
                            engineAssets[`bib://${id}`] = { type: 'image', bitmap };
                        }
                        
                        console.log(`[BIB] Asset bib://${id} loaded (${mime}, ${len} bytes)`);
                        off += 8 + len;
                    }
                }
                
                // Parse BVS (Section 5) — Same header format
                if (sections[5]) {
                    const bvsArr = new Uint8Array(sections[5]);
                    const bvsView = new DataView(sections[5]);
                    let off = 0;
                    while (off + 8 <= sections[5].byteLength) {
                        const id = bvsView.getUint16(off);
                        const fmt = bvsView.getUint8(off + 2);
                        const comp = bvsView.getUint8(off + 3);
                        const len = bvsView.getUint32(off + 4);
                        if (off + 8 + len > sections[5].byteLength) break;
                        
                        const data = bvsArr.slice(off + 8, off + 8 + len);
                        
                        // MIME via magic
                        let mime = 'video/mp4';
                        if (data[4] === 0x66 && data[5] === 0x74 && data[6] === 0x79 && data[7] === 0x70) mime = 'video/mp4'; // ftyp
                        else if (data[0] === 0x1A && data[1] === 0x45) mime = 'video/webm'; // EBML
                        
                        const blob = new Blob([data], { type: mime });
                        const video = document.createElement('video');
                        video.src = URL.createObjectURL(blob);
                        video.autoplay = true; video.loop = true; video.muted = true; video.playsInline = true;
                        video.play().catch(e => console.warn("Video autoplay prevented", e));
                        
                        engineAssets[`bvs://${id}`] = { type: 'video', video };
                        console.log(`[BVS] Asset bvs://${id} loaded (${mime}, ${len} bytes)`);
                        off += 8 + len;
                    }
                }
                
                engine.renderer.assets = engineAssets;

                // Canvas Size Setup
                canvas.width = window.innerWidth * window.devicePixelRatio;
                canvas.height = window.innerHeight * window.devicePixelRatio;
                
                // Device Pixel Scaling
                engine.renderer.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                
                // UI Switch
                loading.style.display = 'none';
                canvas.style.display = 'block';

                // WICHTIG: Warte bis Webfonts (Outfit) geladen sind, bevor Canvas zeichnet
                await document.fonts.ready;

                engine.load(blbBlocks, bdtNodes);
                
                console.log("[Engine] Assets loaded:", Object.keys(engineAssets));
                
                // Video RAF Loop: Kontinuierliches Re-Rendering für Videos
                const hasVideo = Object.values(engineAssets).some(a => a.type === 'video');
                if (hasVideo) {
                    const videoLoop = () => {
                        engine.doFrame();
                        requestAnimationFrame(videoLoop);
                    };
                    requestAnimationFrame(videoLoop);
                }
                
                // === INTERAKTIVE SHOWCASE LOGIK (BWEB POLYFILL) ===
                try {
                    const idMapRes = await fetch('idMap.json?v=' + Date.now());
                    const idMap = await idMapRes.json();
                    
                    // Initialer State
                    const content2 = blbBlocks.find(b => b.nodeId === idMap['tab-content-2']);
                    if (content2) content2.display = 0;

                    engine.onEvent = (nodePath, eventType) => {
                        if (!bdtNodes) return;
                        
                        // 1. Hover System (Cards) - Visual Dynamics
                        if (eventType === 'mousemove') {
                            let repainted = false;
                            for (let i=1; i<=5; i++) {
                                const cid = idMap[`card-${i}`];
                                const blb = blbBlocks.find(b => b.nodeId === cid);
                                if (!blb) continue;
                                const isHover = nodePath.includes(cid);
                                
                                // Speichere Original bg
                                if (!blb._origBg) blb._origBg = blb.backgroundColor;
                                
                                // State Mutation
                                const targetBg = isHover ? 0x242436EE : blb._origBg; // Hellere Card Background
                                if (blb.backgroundColor !== targetBg) {
                                    blb.backgroundColor = targetBg;
                                    repainted = true;
                                }
                            }
                            if (repainted) engine.doFrame();
                        }
                        
                        // Click Events
                        if (eventType === 'click') {
                            // 2. State Mutation (Counter)
                            if (nodePath.includes(idMap['btn-counter'])) {
                                console.time("update");
                                // Wir müssen den Text-Knoten (Child vom Div) updaten, nicht das Div selbst!
                                const divId = idMap['counter-text'];
                                const textNode = bdtNodes.find(n => n.parentId === divId && n.text !== undefined);
                                if (textNode) {
                                    const current = parseInt(textNode.text) || 0;
                                    textNode.text = `${current + 1} Klicks`;
                                    engine.doFrame(); // Synchroner Re-Render in < 1ms
                                }
                                console.timeEnd("update");
                            }
                            
                            // 3. Tab Navigation (SPA Simulator)
                            if (nodePath.includes(idMap['btn-tab-1']) || nodePath.includes(idMap['btn-tab-2'])) {
                                console.time("tab-switch");
                                const isTab1 = nodePath.includes(idMap['btn-tab-1']);
                                
                                const btn1 = blbBlocks.find(b => b.nodeId === idMap['btn-tab-1']);
                                const btn2 = blbBlocks.find(b => b.nodeId === idMap['btn-tab-2']);
                                const content1 = blbBlocks.find(b => b.nodeId === idMap['tab-content-1']);
                                const content2 = blbBlocks.find(b => b.nodeId === idMap['tab-content-2']);
                                
                                if (btn1 && btn2 && content1 && content2) {
                                    // Mutate Display State (1=block, 0=none)
                                    content1.display = isTab1 ? 1 : 0;
                                    content2.display = !isTab1 ? 1 : 0;
                                    
                                    // Mutate Button Styles
                                    btn1.color = isTab1 ? 0xFFFFFFFF : 0x9ca3afFF;
                                    btn1.borderColor = isTab1 ? 0x4facfeCC : 0xFFFFFF1A;
                                    btn2.color = !isTab1 ? 0xFFFFFFFF : 0x9ca3afFF;
                                    btn2.borderColor = !isTab1 ? 0x4facfeCC : 0xFFFFFF1A;
                                    
                                    engine.doFrame();
                                }
                                console.timeEnd("tab-switch");
                            }
                        }
                    };
                    console.log("Interactive JS Controller (Polyfill) loaded.");
                } catch(e) {
                    console.error("Failed to load idMap for interactions:", e);
                }

                console.log("BWEB geladen (%d bytes). Polyfill active.", buffer.byteLength);
            } catch (e) {
                loading.innerHTML = `<div style="color: #e25555">Boot failed: ${e.message}</div>`;
                console.error(e);
            }
        }
        boot();
    </script>
</body>
</html>
