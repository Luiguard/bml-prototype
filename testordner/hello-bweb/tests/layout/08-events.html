<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; margin: 40px; background: #fff; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; display: block; margin-bottom: 20px; }
        .dbl-area { width: 200px; height: 100px; background: #2ecc71; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; margin-bottom: 20px; user-select: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 400px; }
    </style>
</head>
<body>
    <h1>BWEB Event Router</h1>
    
    <button class="btn" id="hoverBtn" onmouseenter="console.log('hover')" onmouseleave="console.log('leave')">
        Hover Me (PointerEvents)
    </button>
    
    <div class="dbl-area" id="dblArea" ondblclick="console.log('dblclick')">
        Double Click Me
    </div>
    
    <button class="btn" id="openModalBtn" data-action="openModal" tabindex="0">
        Open Modal (Click or Enter)
    </button>
    
    <!-- We simulate state logic with opacity = 0 in bweb -->
    <div class="modal-overlay" id="modalOverlay" style="opacity: 0; pointer-events: none;">
        <div class="modal-content" id="modalContent">
            <h2>Interactive Modal</h2>
            <p>Press <strong>Escape</strong> to close this modal, or click outside of it.</p>
            <button class="btn" data-action="closeModal" tabindex="0">Close Modal</button>
        </div>
    </div>
</body>
</html>
