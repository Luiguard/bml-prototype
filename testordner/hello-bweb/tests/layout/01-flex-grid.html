<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .grid-item {
            background: #3498db;
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
        }
        .flex-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2ecc71;
            padding: 20px;
            border-radius: 8px;
        }
        .flex-item {
            background: white;
            padding: 10px 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>CSS Grid</h2>
    <div class="grid-container">
        <div class="grid-item">Grid 1</div>
        <div class="grid-item">Grid 2</div>
        <div class="grid-item">Grid 3</div>
        <div class="grid-item">Grid 4</div>
        <div class="grid-item">Grid 5</div>
        <div class="grid-item">Grid 6</div>
    </div>
    <h2>Flexbox</h2>
    <div class="flex-container">
        <div class="flex-item">Left</div>
        <div class="flex-item" style="font-size: 24px;">Center Large</div>
        <div class="flex-item">Right</div>
    </div>
</body>
</html>
