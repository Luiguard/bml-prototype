<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 40px; font-family: sans-serif; background: #fff; }
        .box1 {
            width: 200px;
            height: 100px;
            background: #1abc9c;
            border-top: 10px solid #c0392b;
            border-right: 5px solid #2980b9;
            border-bottom: 20px solid #8e44ad;
            border-left: 15px solid #f39c12;
            margin-bottom: 40px;
        }
        .box2 {
            width: 200px;
            height: 100px;
            background: #ecf0f1;
            border: 4px solid #34495e;
            border-radius: 50px 0 50px 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Complex Borders</h2>
    <div class="box1"></div>
    
    <h2>Border Radius & Box-Sizing</h2>
    <div class="box2">Content inside</div>
</body>
</html>
