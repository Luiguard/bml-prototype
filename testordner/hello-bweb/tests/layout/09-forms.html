<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; margin: 40px; background: #ecf0f1; }
        form { background: white; padding: 30px; border-radius: 8px; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="email"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="checkbox"], input[type="radio"] { margin-right: 10px; width: 16px; height: 16px; vertical-align: middle; }
        .btn { padding: 12px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <h1>BWEB Forms & Inputs</h1>
    
    <form onsubmit="console.log('form submit'); return false;">
        <div class="form-group">
            <label for="username">Username (Required)</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required value="Ben">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password">
        </div>
        
        <div class="form-group">
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="3" placeholder="Write something..."></textarea>
        </div>
        
        <div class="form-group">
            <label>
                <input type="checkbox" name="tos" checked> I agree to the terms
            </label>
        </div>
        
        <div class="form-group">
            <label>
                <input type="radio" name="gender" value="male" checked> Male
            </label>
            <label>
                <input type="radio" name="gender" value="female"> Female
            </label>
        </div>
        
        <button type="submit" class="btn" data-action="submitForm">Submit</button>
    </form>
</body>
</html>
