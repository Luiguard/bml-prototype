<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #eee; }
        .scroll-box {
            width: 300px;
            height: 300px;
            overflow-y: scroll;
            background: white;
            border: 2px solid #ccc;
            padding: 20px;
        }
        .content {
            height: 800px;
            background: linear-gradient(to bottom, #f39c12, #e74c3c);
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h2>Overflow Scroll (Bitte scrollen)</h2>
    <div class="scroll-box">
        <div class="content">
            <h3>Scroll Content</h3>
            <p>Dieser Bereich ist absichtlich sehr hoch, um das Scrollen zu erzwingen.</p>
        </div>
    </div>
</body>
</html>
