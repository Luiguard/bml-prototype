<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding-top: 60px; font-family: sans-serif; height: 1500px; background: #fafafa; }
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #9b59b6;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }
        .container {
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        .main-content {
            flex: 1;
            background: white;
            padding: 20px;
            height: 800px;
            border: 1px solid #ddd;
        }
        .sticky-sidebar {
            position: sticky;
            top: 80px;
            width: 250px;
            background: #e67e22;
            color: white;
            padding: 20px;
            border-radius: 8px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="fixed-header">
        <h2>Fixed Header</h2>
    </div>
    <div class="container">
        <div class="main-content">
            <h2>Scroll down...</h2>
            <p>The sidebar should stick!</p>
        </div>
        <div class="sticky-sidebar">
            <h3>Sticky Sidebar</h3>
            <p>I stay here.</p>
        </div>
    </div>
</body>
</html>
