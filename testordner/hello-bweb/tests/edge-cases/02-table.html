<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 40px; background: #fff; font-family: sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f6f8; color: #333; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h2>HTML Table Layout</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Rolle</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>Alice</td>
            <td>Admin</td>
            <td style="color: green;">Aktiv</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>User</td>
            <td style="color: red;">Inaktiv</td>
        </tr>
    </table>
</body>
</html>
