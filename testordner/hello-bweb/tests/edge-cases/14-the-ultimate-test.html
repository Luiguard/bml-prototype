<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #ecf0f1; }
        
        .container {
            width: 400px;
            height: 300px;
            background: #ffffff;
            border-radius: 20px;
            border: 4px solid #bdc3c7;
            overflow: scroll;
            padding: 20px;
            margin: 0 auto;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .card {
            background: #3498db;
            color: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: left;
            font-size: 16px;
        }

        .card.right {
            background: #e74c3c;
            text-align: right;
            font-size: 20px;
        }

        .btn {
            background: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            border: 2px solid #27ae60;
        }
        
        .btn:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Ultimate BWEB Test</div>
        <div class="card">
            Dieser Container ist scrollbar (overflow: scroll). 
            Ziehe mit dem Mausrad, um den Inhalt zu verschieben.
        </div>
        <div class="card right">
            Right aligned text mit 20px Font Size.
            Rounded borders mit 10px Radius.
        </div>
        <div class="card">
            Noch eine Karte, um den Bereich zu füllen, 
            damit wir scrollen müssen.
        </div>
        <div class="btn" onclick="alert('Klick Event!')">Klick Mich!</div>
        <div class="card" style="margin-top: 20px;">
            Ende der Liste.
        </div>
    </div>
</body>
</html>
