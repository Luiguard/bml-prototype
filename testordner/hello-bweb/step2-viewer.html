<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BWEB Step 2 Verifikation</title>
</head>
<body>
    <h1>BWEB Step 2: Check Console</h1>
    <script>
    const TAG_MAP = { 1: 'h1', 2: 'p', 3: 'div' };

    async function verifyBweb() {
        try {
            console.log("Fetching step2.bweb...");
            const res = await fetch('step2.bweb');
            if (!res.ok) throw new Error("HTTP error " + res.status);
            const buffer = await res.arrayBuffer();
            const view = new DataView(buffer);
            
            // Parse Header
            let bmlOffset = 0;
            const sectionCount = view.getUint8(5);
            let headerPos = 6;
            for (let i = 0; i < sectionCount; i++) {
                const type = view.getUint8(headerPos);
                if (type === 1) {
                    bmlOffset = view.getUint32(headerPos + 1);
                }
                headerPos += 9;
            }
            
            // Parse BML
            let pos = bmlOffset;
            const nodeCount = view.getUint16(pos); pos += 2;
            
            const rawNodes = [];
            for (let i = 0; i < nodeCount; i++) {
                rawNodes.push({
                    id: i,
                    tagId: view.getUint8(pos),
                    parentId: view.getUint16(pos + 1),
                    firstChildId: view.getUint16(pos + 3),
                    nextSiblingId: view.getUint16(pos + 5),
                    textOffset: view.getUint32(pos + 7),
                    textLength: view.getUint16(pos + 11)
                });
                pos += 13;
            }
            
            const textPoolSize = view.getUint32(pos); pos += 4;
            const textPoolBuffer = new Uint8Array(buffer, pos, textPoolSize);
            const decoder = new TextDecoder('utf-8');
            
            // Build tree
            function buildNode(id) {
                if (id === 0xFFFF) return null;
                const raw = rawNodes[id];
                const node = { tag: TAG_MAP[raw.tagId] || `tag_${raw.tagId}` };
                
                if (raw.textLength > 0) {
                    node.text = decoder.decode(textPoolBuffer.subarray(raw.textOffset, raw.textOffset + raw.textLength));
                }
                
                const children = [];
                let childId = raw.firstChildId;
                while (childId !== 0xFFFF) {
                    const childNode = buildNode(childId);
                    if (childNode) children.push(childNode);
                    childId = rawNodes[childId].nextSiblingId;
                }
                
                if (children.length > 0) {
                    node.children = children;
                }
                
                return node;
            }
            
            // Find roots (nodes with parentId == 0xFFFF)
            const roots = [];
            for (let i = 0; i < nodeCount; i++) {
                if (rawNodes[i].parentId === 0xFFFF) {
                    roots.push(buildNode(i));
                }
            }
            
            console.log("[BML Tree Parsed Successfully]");
            console.dir(roots.length === 1 ? roots[0] : roots, { depth: null });
            
        } catch (e) {
            console.error("Verification failed:", e);
        }
    }
    
    verifyBweb();
    </script>
</body>
</html>
