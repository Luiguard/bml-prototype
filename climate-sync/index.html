<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ClimateSync — Indoor-Positionierung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg-primary: #0a0e17;
  --bg-card: rgba(15, 23, 42, 0.75);
  --bg-card-hover: rgba(20, 30, 55, 0.85);
  --bg-glass: rgba(15, 23, 42, 0.55);
  --border-glass: rgba(100, 140, 255, 0.12);
  --border-active: rgba(100, 180, 255, 0.35);
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #60a5fa;
  --accent-glow: rgba(96, 165, 250, 0.25);
  --zone-indoor: #4fc3f7;
  --zone-balkon: #81c784;
  --zone-transition: #ffb74d;
  --danger: #ef4444;
  --success: #22c55e;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow-card: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--border-glass);
  --shadow-glow: 0 0 20px var(--accent-glow);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(56, 100, 220, 0.08), transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(80, 200, 120, 0.05), transparent);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 340px;
  grid-template-rows: auto 1fr;
  gap: 16px;
  padding: 16px;
  height: 100vh;
}

header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
}

header h1 {
  font-size: 1.15rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-status {
  display: flex;
  gap: 16px;
  align-items: center;
  font-size: 0.8rem;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
  animation: pulse-dot 2s ease-in-out infinite;
}

.status-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
.status-dot.offline { background: var(--danger); animation: none; }

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.main-area {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

.canvas-wrapper {
  flex: 1;
  position: relative;
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  min-height: 400px;
}

.canvas-toolbar {
  position: absolute;
  top: 12px;
  left: 12px;
  display: flex;
  gap: 6px;
  z-index: 10;
}

.tool-btn {
  padding: 8px 14px;
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-sm);
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  color: var(--text-secondary);
  font-size: 0.75rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.tool-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
.tool-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: var(--shadow-glow);
}

canvas#floorplan {
  width: 100%;
  height: 100%;
  cursor: crosshair;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--text-muted) transparent;
}

.panel {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.panel-header {
  padding: 14px 16px 10px;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-glass);
}

.panel-body { padding: 14px 16px; }

.zone-indicator {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
}

.zone-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 100px;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.zone-badge[data-zone="wohnzimmer"] {
  background: rgba(79, 195, 247, 0.15);
  color: var(--zone-indoor);
  border: 1px solid rgba(79, 195, 247, 0.3);
  box-shadow: 0 0 20px rgba(79, 195, 247, 0.1);
}

.zone-badge[data-zone="balkon"] {
  background: rgba(129, 199, 132, 0.15);
  color: var(--zone-balkon);
  border: 1px solid rgba(129, 199, 132, 0.3);
  box-shadow: 0 0 20px rgba(129, 199, 132, 0.1);
}

.zone-badge[data-zone="uebergang"] {
  background: rgba(255, 183, 77, 0.15);
  color: var(--zone-transition);
  border: 1px solid rgba(255, 183, 77, 0.3);
}

.zone-badge[data-zone=""] {
  background: rgba(100, 116, 139, 0.15);
  color: var(--text-muted);
  border: 1px solid rgba(100, 116, 139, 0.2);
}

.climate-controls {
  display: flex;
  gap: 8px;
  padding: 0 16px 16px;
}

.mode-btn {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-sm);
  background: var(--bg-glass);
  color: var(--text-secondary);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s;
}

.mode-btn:hover { border-color: var(--text-muted); }
.mode-btn.active-cool {
  border-color: var(--zone-indoor);
  color: var(--zone-indoor);
  background: rgba(79, 195, 247, 0.1);
}
.mode-btn.active-fan {
  border-color: var(--zone-balkon);
  color: var(--zone-balkon);
  background: rgba(129, 199, 132, 0.1);
}

.rssi-list { list-style: none; }

.rssi-item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(100, 140, 255, 0.05);
  font-size: 0.78rem;
}

.rssi-item:last-child { border-bottom: none; }
.rssi-item .name { color: var(--text-secondary); }
.rssi-item .value { font-weight: 600; font-variant-numeric: tabular-nums; }

.rssi-bar {
  grid-column: 1 / -1;
  height: 3px;
  border-radius: 2px;
  background: rgba(100, 140, 255, 0.08);
  margin-top: 4px;
  overflow: hidden;
}

.rssi-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.5s ease, background 0.5s ease;
}

.history-list {
  list-style: none;
  max-height: 200px;
  overflow-y: auto;
  scrollbar-width: thin;
}

.history-item {
  padding: 6px 0;
  border-bottom: 1px solid rgba(100, 140, 255, 0.05);
  font-size: 0.72rem;
  color: var(--text-secondary);
  display: flex;
  justify-content: space-between;
}

.history-item .time { color: var(--text-muted); font-variant-numeric: tabular-nums; }

.config-form { display: flex; flex-direction: column; gap: 10px; }

.config-form label {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.config-form input, .config-form select {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border-glass);
  border-radius: var(--radius-sm);
  background: rgba(10, 14, 23, 0.6);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 0.82rem;
  outline: none;
  transition: border-color 0.2s;
}

.config-form input:focus { border-color: var(--accent); }

.btn-save {
  padding: 10px;
  border: none;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent), #818cf8);
  color: white;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-save:hover { opacity: 0.9; }
.btn-save:active { transform: scale(0.97); }

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border-glass);
}

.tab-btn {
  flex: 1;
  padding: 10px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border-bottom: 2px solid transparent;
}

.tab-btn:hover { color: var(--text-secondary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

.tab-content { display: none; }
.tab-content.active { display: block; }

.ap-list { list-style: none; }

.ap-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid rgba(100, 140, 255, 0.05);
  font-size: 0.78rem;
}

.ap-item .ap-name { color: var(--text-secondary); }
.ap-item .ap-bssid { color: var(--text-muted); font-family: 'Courier New', monospace; font-size: 0.7rem; }

.btn-small {
  padding: 4px 10px;
  border: 1px solid var(--border-glass);
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 0.68rem;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-small:hover { border-color: var(--accent); color: var(--accent); }
.btn-small.danger:hover { border-color: var(--danger); color: var(--danger); }

.zone-list { list-style: none; }

.zone-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(100, 140, 255, 0.05);
  font-size: 0.78rem;
}

.zone-color-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.modal-overlay.visible { display: flex; }

.modal {
  background: var(--bg-card);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-glass);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  padding: 24px;
  min-width: 360px;
  max-width: 90vw;
}

.modal h3 {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 16px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
    height: auto;
    min-height: 100vh;
  }
  .canvas-wrapper { min-height: 50vh; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⚡ ClimateSync</h1>
    <div class="header-status">
      <span><span class="status-dot offline" id="wsStatus"></span><span id="wsLabel">Verbinde…</span></span>
      <span><span class="status-dot offline" id="tuyaStatus"></span><span id="tuyaLabel">Tuya</span></span>
    </div>
  </header>

  <div class="main-area">
    <div class="canvas-wrapper">
      <div class="canvas-toolbar">
        <button class="tool-btn active" data-tool="select" id="toolSelect">↖ Auswahl</button>
        <button class="tool-btn" data-tool="zone" id="toolZone">▢ Zone zeichnen</button>
        <button class="tool-btn" id="btnPinPos" onclick="pinCurrentPosition()" style="display:none; border-color: var(--zone-transition); color: var(--zone-transition)">📍 Eckpunkt bei akt. Position setzen</button>
        <button class="tool-btn" data-tool="ap" id="toolAP">📡 AP</button>
        <button class="tool-btn" data-tool="bg" id="toolBG">🖼 Hintergrund</button>
        <button class="tool-btn" data-tool="clear" id="toolClear">🗑 Alles löschen</button>
      </div>
      <canvas id="floorplan"></canvas>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="panel-header">Aktuelle Zone</div>
      <div class="zone-indicator">
        <span class="zone-badge" data-zone="" id="zoneBadge">— Keine Daten —</span>
      </div>
      <div class="climate-controls">
        <button class="mode-btn" id="btnCool" onclick="overrideMode('cool')">❄ Kühlen</button>
        <button class="mode-btn" id="btnFan" onclick="overrideMode('fan')">🌀 Lüfter</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">RSSI Signalstärke</div>
      <div class="panel-body">
        <ul class="rssi-list" id="rssiList"></ul>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">Verlauf</div>
      <div class="panel-body">
        <ul class="history-list" id="historyList"></ul>
      </div>
    </div>

    <div class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="aps" onclick="switchTab('aps')">Access Points</button>
        <button class="tab-btn" data-tab="zones" onclick="switchTab('zones')">Zonen</button>
        <button class="tab-btn" data-tab="tuya" onclick="switchTab('tuya')">Tuya</button>
      </div>
      <div class="tab-content active" id="tab-aps">
        <div class="panel-body">
          <ul class="ap-list" id="apList"></ul>
        </div>
      </div>
      <div class="tab-content" id="tab-zones">
        <div class="panel-body">
          <ul class="zone-list" id="zoneList"></ul>
        </div>
      </div>
      <div class="tab-content" id="tab-tuya">
        <div class="panel-body">
          <div class="config-form">
            <label>Device ID</label>
            <input id="tuyaDeviceId" placeholder="bf13843eb35db0bd94hazj">
            <label>Local Key</label>
            <input id="tuyaLocalKey" placeholder="Aus tinytuya wizard">
            <label>IP Adresse</label>
            <input id="tuyaIP" placeholder="192.168.68.50">
            <label>Mode DP</label>
            <input id="tuyaModeDp" type="number" value="4">
            <button class="btn-save" onclick="saveTuyaConfig()">Speichern</button>
            <button class="btn-small" onclick="scanTuya()">🔍 Netzwerk scannen</button>
            <ul class="ap-list" id="tuyaScanResults"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<input type="file" id="bgFileInput" accept="image/*" hidden>

<script>
const WS_URL = `ws://${location.hostname}:8766`;
let ws = null;
let config = null;
let canvas, ctx;
let currentTool = 'select';
let bgImage = null;
let drawingZone = null;
let zonePoints = [];
let selectedAP = null;
let draggingAP = null;
let selectedZone = null;
let positionData = null;
let animPos = null;
let history = [];
let canvasScale = 1;
let canvasOffset = { x: 0, y: 0 };

function init() {
  canvas = document.getElementById('floorplan');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  canvas.addEventListener('mousedown', onCanvasDown);
  canvas.addEventListener('mousemove', onCanvasMove);
  canvas.addEventListener('mouseup', onCanvasUp);
  canvas.addEventListener('dblclick', onCanvasDblClick);
  document.getElementById('bgFileInput').addEventListener('change', onBgFile);
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
    b.addEventListener('click', () => setTool(b.dataset.tool));
  });
  connectWS();
  requestAnimationFrame(renderLoop);
}

function resizeCanvas() {
  const r = canvas.parentElement.getBoundingClientRect();
  canvas.width = r.width;
  canvas.height = r.height;
}

function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('wsStatus').className = 'status-dot online';
    document.getElementById('wsLabel').textContent = 'Verbunden';
  };
  ws.onclose = () => {
    document.getElementById('wsStatus').className = 'status-dot offline';
    document.getElementById('wsLabel').textContent = 'Getrennt';
    setTimeout(connectWS, 3000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'init') {
      config = msg.config;
      history = msg.history || [];
      renderSidebar();
      loadTuyaForm();
    } else if (msg.type === 'update') {
      handleUpdate(msg);
    } else if (msg.type === 'config_updated') {
      config = msg.config;
      renderSidebar();
    } else if (msg.type === 'tuya_scan_result') {
      showTuyaScan(msg.devices);
    }
  };
}

function handleUpdate(msg) {
  if (msg.position) {
    if (!animPos) animPos = { ...msg.position };
    else {
      animPos.x += (msg.position.x - animPos.x) * 0.3;
      animPos.y += (msg.position.y - animPos.y) * 0.3;
    }
  }
  positionData = msg;

  const zoneBadge = document.getElementById('zoneBadge');
  const zone = msg.zone || '';
  const zoneNames = { wohnzimmer: 'Wohnzimmer', balkon: 'Balkon', uebergang: 'Übergang' };
  const zoneCfg = config?.zones?.find(z => z.id === zone);
  zoneBadge.dataset.zone = zone;
  zoneBadge.textContent = zoneCfg?.name || zoneNames[zone] || '— Keine Daten —';

  const tuyaConnected = msg.tuya?.connected;
  document.getElementById('tuyaStatus').className = `status-dot ${tuyaConnected ? 'online' : 'offline'}`;

  const mode = msg.tuya?.mode;
  document.getElementById('btnCool').className = `mode-btn ${mode === 'cool' ? 'active-cool' : ''}`;
  document.getElementById('btnFan').className = `mode-btn ${mode === 'fan' ? 'active-fan' : ''}`;

  updateRSSI(msg.rssi || {}, msg.raw_rssi || {});

  if (msg.zone && history.length && history[history.length - 1].zone !== msg.zone) {
    history.push({ zone: msg.zone, timestamp: msg.timestamp });
    renderHistory();
  }
}

function updateRSSI(filtered, raw) {
  if (!config) return;
  const list = document.getElementById('rssiList');
  list.innerHTML = '';
  for (const ap of config.access_points) {
    const rssi = filtered[ap.id] ?? -100;
    const rawRssi = raw[ap.bssid?.toLowerCase()] ?? rssi;
    const pct = Math.max(0, Math.min(100, (rssi + 100) * 1.5));
    const hue = pct * 1.2;
    const li = document.createElement('li');
    li.className = 'rssi-item';
    li.innerHTML = `
      <span class="name">${ap.name}</span>
      <span class="value" style="color: hsl(${hue}, 70%, 60%)">${Math.round(rssi)} dBm</span>
      <div class="rssi-bar"><div class="rssi-bar-fill" style="width:${pct}%;background:hsl(${hue},70%,50%)"></div></div>
    `;
    list.appendChild(li);
  }
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const items = [...history].reverse().slice(0, 30);
  for (const h of items) {
    const li = document.createElement('li');
    li.className = 'history-item';
    const d = new Date(h.timestamp * 1000);
    const time = d.toLocaleTimeString('de-DE');
    const zoneNames = { wohnzimmer: '🏠 Wohnzimmer', balkon: '🌿 Balkon', uebergang: '↔ Übergang' };
    li.innerHTML = `<span>${zoneNames[h.zone] || h.zone}</span><span class="time">${time}</span>`;
    list.appendChild(li);
  }
}

function renderSidebar() {
  if (!config) return;
  const apList = document.getElementById('apList');
  apList.innerHTML = '';
  for (const ap of config.access_points) {
    const li = document.createElement('li');
    li.className = 'ap-item';
    li.innerHTML = `
      <div>
        <div class="ap-name">${ap.name}</div>
        <div class="ap-bssid">${ap.bssid}</div>
      </div>
      <div style="display:flex;gap:4px">
        <button class="btn-small" onclick="editAP('${ap.id}')">✏</button>
        <button class="btn-small danger" onclick="deleteAP('${ap.id}')">✕</button>
      </div>
    `;
    apList.appendChild(li);
  }

  const zoneList = document.getElementById('zoneList');
  zoneList.innerHTML = '';
  for (const z of config.zones) {
    const li = document.createElement('li');
    li.className = 'zone-item';
    li.innerHTML = `
      <span class="zone-color-dot" style="background:${z.color}"></span>
      <span style="flex:1">${z.name}</span>
      <span style="font-size:0.7rem;color:var(--text-muted)">${z.actions?.climate_mode || '—'}</span>
      <button class="btn-small danger" onclick="deleteZone('${z.id}')">✕</button>
    `;
    zoneList.appendChild(li);
  }

  renderHistory();
}

function renderLoop() {
  drawCanvas();
  requestAnimationFrame(renderLoop);
}

function drawCanvas() {
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, w, h);

  const gridSize = 40;
  ctx.strokeStyle = 'rgba(100, 140, 255, 0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y < h; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  if (bgImage) {
    ctx.globalAlpha = 0.3;
    ctx.drawImage(bgImage, 0, 0, w, h);
    ctx.globalAlpha = 1;
  }

  if (config) {
    for (const z of config.zones) {
      drawZone(z, z.id === positionData?.zone);
    }

    for (const ap of config.access_points) {
      drawAP(ap);
    }

    if (animPos) {
      drawPosition(animPos);
    }
  }

  if (currentTool === 'zone' && zonePoints.length > 0) {
    drawTempZone();
  }
}

function drawZone(z, active) {
  if (!z.polygon || z.polygon.length < 3) return;
  ctx.beginPath();
  ctx.moveTo(z.polygon[0][0], z.polygon[0][1]);
  for (let i = 1; i < z.polygon.length; i++) {
    ctx.lineTo(z.polygon[i][0], z.polygon[i][1]);
  }
  ctx.closePath();

  const color = z.color || '#60a5fa';
  ctx.fillStyle = active
    ? color.replace(')', ',0.2)').replace('rgb', 'rgba').replace('#', '') || `${color}33`
    : `${color}11`;

  const r = parseInt(color.slice(1, 3), 16) || 100;
  const g = parseInt(color.slice(3, 5), 16) || 140;
  const b = parseInt(color.slice(5, 7), 16) || 255;
  ctx.fillStyle = active ? `rgba(${r},${g},${b},0.18)` : `rgba(${r},${g},${b},0.06)`;
  ctx.fill();

  ctx.strokeStyle = active ? `rgba(${r},${g},${b},0.7)` : `rgba(${r},${g},${b},0.25)`;
  ctx.lineWidth = active ? 2.5 : 1.5;
  ctx.setLineDash(active ? [] : [6, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  const cx = z.polygon.reduce((s, p) => s + p[0], 0) / z.polygon.length;
  const cy = z.polygon.reduce((s, p) => s + p[1], 0) / z.polygon.length;
  ctx.fillStyle = active ? `rgba(${r},${g},${b},0.9)` : `rgba(${r},${g},${b},0.45)`;
  ctx.font = `${active ? '600' : '500'} 13px Inter, system-ui`;
  ctx.textAlign = 'center';
  ctx.fillText(z.name, cx, cy);
}

function drawAP(ap) {
  const x = ap.position.x;
  const y = ap.position.y;

  const rssi = positionData?.rssi?.[ap.id] ?? -100;
  const strength = Math.max(0, Math.min(1, (rssi + 100) / 60));

  for (let i = 3; i > 0; i--) {
    const r = 15 + i * 18 * strength;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(96, 165, 250, ${0.03 * (4 - i) * strength})`;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(x, y, 8, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x, y, 2, x, y, 8);
  grad.addColorStop(0, `rgba(96, 165, 250, ${0.5 + strength * 0.5})`);
  grad.addColorStop(1, `rgba(96, 165, 250, 0.1)`);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(96, 165, 250, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = 'rgba(96, 165, 250, 0.7)';
  ctx.font = '500 10px Inter, system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(ap.name, x, y - 16);

  if (rssi > -100) {
    ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
    ctx.font = '10px Inter, system-ui';
    ctx.fillText(`${Math.round(rssi)} dBm`, x, y + 22);
  }
}

function drawPosition(pos) {
  const t = Date.now() / 1000;

  for (let i = 3; i > 0; i--) {
    const r = 8 + i * 6 + Math.sin(t * 2 + i) * 2;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(250, 204, 21, ${0.08 * (4 - i)})`;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(pos.x, pos.y, 1, pos.x, pos.y, 6);
  grad.addColorStop(0, '#fbbf24');
  grad.addColorStop(1, '#f59e0b');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(251, 191, 36, 0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.shadowColor = 'rgba(251, 191, 36, 0.5)';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#fef3c7';
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawTempZone() {
  if (zonePoints.length < 1) return;
  ctx.beginPath();
  ctx.moveTo(zonePoints[0][0], zonePoints[0][1]);
  for (let i = 1; i < zonePoints.length; i++) {
    ctx.lineTo(zonePoints[i][0], zonePoints[i][1]);
  }
  ctx.strokeStyle = 'rgba(250, 204, 21, 0.7)';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  for (const p of zonePoints) {
    ctx.beginPath();
    ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fbbf24';
    ctx.fill();
  }
}

function setTool(tool) {
  if (tool === 'bg') {
    document.getElementById('bgFileInput').click();
    return;
  }
  if (tool === 'clear') {
    if (confirm('Alle Zonen und APs löschen?')) {
      config.zones = [];
      config.access_points = [];
      saveConfig();
    }
    return;
  }
  currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tool-btn[data-tool="${tool}"]`)?.classList.add('active');
  document.getElementById('btnPinPos').style.display = (tool === 'zone') ? 'inline-block' : 'none';
  zonePoints = [];
  canvas.style.cursor = tool === 'select' ? 'default' : 'crosshair';
}

function pinCurrentPosition() {
  if (currentTool === 'zone' && animPos) {
    zonePoints.push([Math.round(animPos.x), Math.round(animPos.y)]);
  }
}

function getCanvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onCanvasDown(e) {
  const pos = getCanvasPos(e);

  if (currentTool === 'select') {
    for (const ap of (config?.access_points || [])) {
      const dx = ap.position.x - pos.x;
      const dy = ap.position.y - pos.y;
      if (Math.sqrt(dx * dx + dy * dy) < 15) {
        draggingAP = ap;
        return;
      }
    }
  }

  if (currentTool === 'zone') {
    zonePoints.push([Math.round(pos.x), Math.round(pos.y)]);
  }

  if (currentTool === 'ap') {
    showAPModal(pos);
  }
}

function onCanvasMove(e) {
  if (draggingAP) {
    const pos = getCanvasPos(e);
    draggingAP.position.x = Math.round(pos.x);
    draggingAP.position.y = Math.round(pos.y);
  }
}

function onCanvasUp() {
  if (draggingAP) {
    saveConfig();
    draggingAP = null;
  }
}

function onCanvasDblClick() {
  if (currentTool === 'zone' && zonePoints.length >= 3) {
    showZoneModal();
  }
}

function showAPModal(pos) {
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>Access Point hinzufügen</h3>
    <div class="config-form">
      <label>Name</label>
      <input id="apModalName" placeholder="z.B. Deco Wohnzimmer">
      <label>BSSID</label>
      <input id="apModalBssid" placeholder="3c:64:cf:e4:62:ee">
    </div>
    <div class="modal-actions">
      <button class="btn-small" onclick="closeModal()">Abbrechen</button>
      <button class="btn-save" onclick="addAP(${pos.x}, ${pos.y})">Hinzufügen</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('visible');
}

function addAP(x, y) {
  const name = document.getElementById('apModalName').value.trim();
  const bssid = document.getElementById('apModalBssid').value.trim().toLowerCase();
  if (!name || !bssid) return;
  const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
  config.access_points.push({ id, name, bssid, position: { x: Math.round(x), y: Math.round(y) } });
  saveConfig();
  closeModal();
  setTool('select');
}

function showZoneModal() {
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>Zone benennen</h3>
    <div class="config-form">
      <label>Name</label>
      <input id="zoneModalName" placeholder="z.B. Wohnzimmer">
      <label>Farbe</label>
      <input id="zoneModalColor" type="color" value="#4fc3f7">
      <label>Klima-Modus bei Betreten</label>
      <select id="zoneModalMode">
        <option value="">— Keine Aktion —</option>
        <option value="cool">❄ Kühlen (cool)</option>
        <option value="fan">🌀 Lüfter (fan)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-small" onclick="closeModal(); zonePoints=[];">Abbrechen</button>
      <button class="btn-save" onclick="addZone()">Speichern</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('visible');
}

function addZone() {
  const name = document.getElementById('zoneModalName').value.trim();
  const color = document.getElementById('zoneModalColor').value;
  const mode = document.getElementById('zoneModalMode').value;
  if (!name) return;
  const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
  const actions = mode ? { climate_mode: mode } : {};
  config.zones.push({ id, name, color, polygon: [...zonePoints], actions });
  zonePoints = [];
  saveConfig();
  closeModal();
  setTool('select');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
}

function editAP(id) {
  const ap = config.access_points.find(a => a.id === id);
  if (!ap) return;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>AP bearbeiten: ${ap.name}</h3>
    <div class="config-form">
      <label>Name</label>
      <input id="apEditName" value="${ap.name}">
      <label>BSSID</label>
      <input id="apEditBssid" value="${ap.bssid}">
    </div>
    <div class="modal-actions">
      <button class="btn-small" onclick="closeModal()">Abbrechen</button>
      <button class="btn-save" onclick="updateAP('${id}')">Speichern</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('visible');
}

function updateAP(id) {
  const ap = config.access_points.find(a => a.id === id);
  if (!ap) return;
  ap.name = document.getElementById('apEditName').value.trim();
  ap.bssid = document.getElementById('apEditBssid').value.trim().toLowerCase();
  saveConfig();
  closeModal();
}

function deleteAP(id) {
  config.access_points = config.access_points.filter(a => a.id !== id);
  saveConfig();
}

function deleteZone(id) {
  config.zones = config.zones.filter(z => z.id !== id);
  saveConfig();
}

function saveConfig() {
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'save_config', config }));
  }
  renderSidebar();
}

function overrideMode(mode) {
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'override_mode', mode }));
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${tab}`));
}

function loadTuyaForm() {
  if (!config) return;
  document.getElementById('tuyaDeviceId').value = config.tuya.device_id || '';
  document.getElementById('tuyaLocalKey').value = config.tuya.local_key || '';
  document.getElementById('tuyaIP').value = config.tuya.ip || '';
  document.getElementById('tuyaModeDp').value = config.tuya.mode_dp || 4;
}

function saveTuyaConfig() {
  config.tuya.device_id = document.getElementById('tuyaDeviceId').value.trim();
  config.tuya.local_key = document.getElementById('tuyaLocalKey').value.trim();
  config.tuya.ip = document.getElementById('tuyaIP').value.trim();
  config.tuya.mode_dp = parseInt(document.getElementById('tuyaModeDp').value) || 4;
  saveConfig();
}

function scanTuya() {
  if (ws?.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'tuya_scan' }));
    document.getElementById('tuyaScanResults').innerHTML = '<li class="ap-item" style="justify-content:center;color:var(--text-muted)">Scanne…</li>';
  }
}

function showTuyaScan(devices) {
  const list = document.getElementById('tuyaScanResults');
  list.innerHTML = '';
  if (!devices.length) {
    list.innerHTML = '<li class="ap-item" style="color:var(--text-muted)">Keine Geräte gefunden</li>';
    return;
  }
  for (const d of devices) {
    const li = document.createElement('li');
    li.className = 'ap-item';
    li.innerHTML = `
      <div>
        <div class="ap-name">${d.id}</div>
        <div class="ap-bssid">${d.ip} | v${d.ver} | ${d.productKey || ''}</div>
      </div>
      <button class="btn-small" onclick="useTuyaDevice('${d.id}','${d.ip}','${d.ver}')">Verwenden</button>
    `;
    list.appendChild(li);
  }
}

function useTuyaDevice(id, ip, ver) {
  document.getElementById('tuyaDeviceId').value = id;
  document.getElementById('tuyaIP').value = ip;
}

function onBgFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => { bgImage = img; };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  setTool('select');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
