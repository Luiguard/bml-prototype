<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Converter - Alles konvertieren</title>
    <meta name="description" content="Konvertieren Sie Word zu PDF, LibreOffice zu Word, Videos und mehr mit unserem premium Online-Tool.">
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav style="display: flex; gap: 2rem; margin-bottom: 2rem; animation: fadeIn 0.8s ease-out;">
        <a href="index.html" style="color: var(--text-primary); text-decoration: none; font-weight: 600; border-bottom: 2px solid var(--accent-primary);">Home</a>
        <a href="career.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: color 0.3s;">Karriere & Lebenslauf</a>
    </nav>
    <div class="container">
        <header>
            <h1>Universal Converter</h1>
            <p class="subtitle">Konvertieren Sie Dokumente und Videos in Sekunden.</p>
        </header>

        <main>
            <div id="drop-zone" class="drop-zone">
                <input type="file" id="file-input" hidden>
                <div class="drop-zone-content">
                    <i data-lucide="upload-cloud" class="pulse"></i>
                    <p class="drop-zone-text">Dateien hierher ziehen oder <span style="color: var(--accent-primary); font-weight: 600;">durchsuchen</span></p>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem;">Word, PDF, ODT, MP4, WebM...</p>
                </div>
            </div>

            <div id="file-info" class="file-info">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <i data-lucide="file-text" id="file-icon"></i>
                        <span id="file-name" style="font-weight: 500;">document.docx</span>
                    </div>
                    <span id="file-size" style="color: var(--text-secondary); font-size: 0.8rem;">2.4 MB</span>
                </div>
            </div>

            <div class="options-grid">
                <div class="option-group">
                    <label for="output-format">Zielformat</label>
                    <select id="output-format">
                        <option value="">Wähle Format...</option>
                        <optgroup label="Dokumente">
                            <option value="pdf">PDF (.pdf)</option>
                            <option value="docx">Word (.docx)</option>
                            <option value="odt">LibreOffice (.odt)</option>
                        </optgroup>
                        <optgroup label="Video">
                            <option value="mp4">MP4 (.mp4)</option>
                            <option value="webm">WebM (.webm)</option>
                            <option value="mkv">MKV (.mkv)</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <button id="convert-btn" class="convert-btn" disabled>Jetzt konvertieren</button>

            <div id="progress-container" class="progress-container">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span id="status-text" class="status-text">Wird verarbeitet...</span>
                    <span id="percentage-text" class="status-text">0%</span>
                </div>
            </div>

            <div id="download-area" style="margin-top: 2rem; display: none;">
                <a id="download-link" href="#" class="convert-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--success-color);">
                    <i data-lucide="download"></i>
                    Datei herunterladen
                </a>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Universal Converter. Schnell, Sicher, Einfach.</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
