<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BWEB vs DOM Benchmark</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0f; color: #fff; padding: 2rem; }
        .bar { height: 20px; background: #2ea043; margin: 10px 0; border-radius: 4px; transition: width 0.3s; }
        .bar.dom { background: #e25555; }
        #results { margin-top: 2rem; font-family: monospace; }
        iframe { width: 1px; height: 1px; opacity: 0; position: absolute; }
    </style>
</head>
<body>
    <h1>BWEB vs DOM Rendering Benchmark</h1>
    <button onclick="runBenchmark()">Run Benchmark (10 Iterations)</button>
    
    <div id="results"></div>

    <script>
        async function loadBweb() {
            const start = performance.now();
            const res = await fetch('../dist/website.bweb');
            const buf = await res.arrayBuffer();
            // Simulate minimal Engine overhead
            const view = new DataView(buf);
            const header = view.getUint32(0);
            return performance.now() - start;
        }

        async function loadDom() {
            return new Promise(resolve => {
                const start = performance.now();
                const iframe = document.createElement('iframe');
                iframe.src = '../src/index.html';
                iframe.onload = () => {
                    resolve(performance.now() - start);
                    iframe.remove();
                };
                document.body.appendChild(iframe);
            });
        }

        async function runBenchmark() {
            const results = document.getElementById('results');
            results.innerHTML = 'Running...<br>';
            
            let bwebTotal = 0;
            let domTotal = 0;
            const iterations = 10;

            for(let i=0; i<iterations; i++) {
                bwebTotal += await loadBweb();
                domTotal += await loadDom();
            }

            const bwebAvg = (bwebTotal / iterations).toFixed(2);
            const domAvg = (domTotal / iterations).toFixed(2);

            results.innerHTML += `
                <div style="margin-top:20px;">
                    <strong>DOM Load (Avg):</strong> ${domAvg} ms
                    <div class="bar dom" style="width: ${(domAvg / 10)}%"></div>
                </div>
                <div style="margin-top:20px;">
                    <strong>BWEB Load + Parse (Avg):</strong> ${bwebAvg} ms
                    <div class="bar" style="width: ${(bwebAvg / 10)}%"></div>
                </div>
                <br>
                <h3>BWEB ist ${(domAvg / bwebAvg).toFixed(1)}x schneller!</h3>
            `;
        }
    </script>
</body>
</html>
